services:
  - type: web
    name: futebol-stats-platform
    env: docker
    plan: free
    envVars:
      - key: API_FOOTBALL_KEY
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: futebol-stats-db
          property: connectionString

databases:
  - name: futebol-stats-db
    plan: free
