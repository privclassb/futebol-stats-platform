services:
  - type: web
    name: futebol-stats-platform
    env: docker
    plan: free
    envVars:
      - key: API_FOOTBALL_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
        # Cole aqui a "Connection string" do seu banco Neon (neon.tech) —
        # veja o README para o passo a passo.
      - key: DATABASE_SSL
        value: "true"
      - key: ADMIN_TOKEN
        generateValue: true
